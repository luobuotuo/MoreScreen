<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>remote-screen 接收端（WebRTC）</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101114; color: #e8eaed; font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  header { padding: 10px 14px; border-bottom: 1px solid #26282e; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .stat { color: #9aa0a6; font-variant-numeric: tabular-nums; }
  .stat b { color: #8ab4f8; font-weight: 600; }
  .ok { color: #81c995; } .bad { color: #f28b82; } .warn { color: #fdd663; }
  #stage { padding: 16px; }
  video { width: 100%; height: auto; background: #000; border-radius: 8px; display: block; }
  #start { display: block; width: 100%; max-width: 420px; margin: 40px auto; padding: 16px; font-size: 16px;
           background: #1a73e8; color: #fff; border: 0; border-radius: 10px; }
  .tool { display: none; margin: 8px auto 0; padding: 8px 14px; font-size: 13px;
          background: #26282e; color: #e8eaed; border: 0; border-radius: 8px; }
  /* 1:1 原始尺寸模式：不做任何缩放，用于排除非整数倍缩放带来的采样抖动 */
  video.native { width: auto !important; height: auto !important; max-width: none; }
  /* 控制模式必须禁用浏览器手势：否则触摸滑动会被当作滚动/缩放，
     浏览器直接发 pointercancel 掐断拖动（表现为"按下去动一下，之后不跟随"）。 */
  video.controlling { touch-action: none; }
  /* 全屏沉浸：只留画面，其余 UI 全部隐藏 */
  #stage:fullscreen { padding: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  /* 宽高都必须是 auto + 双 max，元素才能保持视频内容比例。
     写成 height:100vh 会把元素撑成视口比例，浏览器随后在元素内部加 letterbox 黑边，
     归一化坐标一旦把黑边算进去，注入位置就会整体偏移（实测表现为
     「光标要放到窗口标题栏上边框才能拖动」「任务栏图标只有特定位置点得到」）。 */
  #stage:fullscreen video { width: auto; height: auto; max-width: 100vw; max-height: 100vh; border-radius: 0; }
  #stage:fullscreen #start,
  #stage:fullscreen .tool,
  #stage:fullscreen .bar,
  #stage:fullscreen #log { display: none !important; }
  /* 全屏时必须保留「控制本机」入口，否则全屏后没有任何途径开启输入回传。
     做成角落的浮动小按钮，不干扰观感（退出全屏在右上，这个放左上）。 */
  #stage:fullscreen #ctlbtn {
    display: block !important; position: fixed; left: 10px; top: 10px; z-index: 9;
    margin: 0; padding: 6px 10px; font-size: 12px;
    background: rgba(0,0,0,.45); color: #cfd3d8;
    border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
  }
  #stage:fullscreen #ctlbtn.on { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  #ctlbtn:disabled { opacity: .55; cursor: not-allowed; }
  /* 连接状态胶囊（P2.7 四态） */
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px;
          background: #26282e; color: #9aa0a6; border: 1px solid #33363d; }
  .pill.ok { background: rgba(129,201,149,.14); color: #81c995; border-color: rgba(129,201,149,.35); }
  .pill.warn { background: rgba(253,214,99,.13); color: #fdd663; border-color: rgba(253,214,99,.32); }
  .pill.bad { background: rgba(242,139,130,.14); color: #f28b82; border-color: rgba(242,139,130,.35); }
  /* 已开启控制时的按钮高亮，避免误以为还在控制 */
  .tool.on { background: #1a73e8; color: #fff; }
  /* 全屏时浮一个极小的退出按钮（触摸即可，不干扰观感） */
  #exitfs { display: none; position: fixed; top: 8px; right: 8px; z-index: 9;
            padding: 6px 10px; font-size: 12px; background: rgba(0,0,0,.45); color: #cfd3d8;
            border: 1px solid rgba(255,255,255,.18); border-radius: 6px; }
  #stage:fullscreen #exitfs { display: block; }
  .bar { height: 4px; background: #26282e; border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: #8ab4f8; transition: width .2s; }
  #log { margin-top: 12px; color: #9aa0a6; font-size: 12px; white-space: pre-wrap; max-height: 30vh; overflow: auto; }
  /* 本地光标：宿主以 --no-cursor 启动时画面不含光标，
     由接收端在这里自己画一个，位置跟手指/鼠标走——零延迟，不受编码帧率影响。 */
  #cursor { position: fixed; left: 0; top: 0; width: 22px; height: 22px;
            pointer-events: none; z-index: 9999; display: none;
            filter: drop-shadow(0 0 1.2px rgba(0,0,0,.95)); will-change: transform; }
</style>
</head>
<body>
<header>
  <h1>remote-screen · WebRTC</h1>
  <span id="state" class="pill">未连接</span>
  <span class="stat">会话 <b id="sid">—</b></span>
  <span class="stat">信令 <b id="ws">未连接</b></span>
  <span class="stat">ICE <b id="ice">—</b></span>
  <span class="stat">连接 <b id="pc">—</b></span>
  <span class="stat">分辨率 <b id="res">—</b></span>
  <span class="stat">帧率 <b id="fps">—</b></span>
  <span class="stat">码率 <b id="rate">—</b></span>
  <span class="stat">丢包 <b id="loss">—</b></span>
  <span class="stat">帧 <b id="frames">—</b></span>
  <span class="stat">重传 <b id="retx">—</b></span>
  <span class="stat">RTT <b id="rtt">—</b></span>
  <span class="stat">缓冲 <b id="jb">—</b></span>
  <span class="stat">玻璃到玻璃 <b id="e2e">—</b></span>
  <span class="stat">控制通道 <b id="dcstat">—</b></span>
</header>

<div id="stage">
  <video id="v" playsinline webkit-playsinline muted autoplay></video>
  <button id="start">点击开始接收</button>
  <button id="native" class="tool">1:1 原始尺寸</button>
  <button id="fs" class="tool">进入全屏</button>
  <button id="ctlbtn" class="tool" disabled>控制通道连接中…</button>
  <button id="exitfs">退出全屏</button>
  <!-- 本地光标必须在 #stage 内部：Fullscreen API 只渲染全屏元素的子树，
       放在 stage 外面的话一进全屏就被丢弃（脚本仍在跑，只是看不见）。 -->
  <svg id="cursor" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 2 L3 19.2 L7.3 15 L9.8 21.2 L12.7 19.9 L10.4 14 L16.2 14 Z"
          fill="#ffffff" stroke="#000000" stroke-width="1.1" stroke-linejoin="round"/>
  </svg>
  <div class="bar"><i id="bar"></i></div>
  <div id="log"></div>
</div>

<script>
const el = id => document.getElementById(id);
const logEl = el('log');
const lines = [];
function L(s) {
  const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  lines.push('[' + ts + '] ' + s);
  if (lines.length > 200) lines.splice(0, lines.length - 200);
  logEl.textContent = lines.join('\n');
  logEl.scrollTop = logEl.scrollHeight;
}

const WS_PORT = 8787;
const video = el('v');

// ---- P2 交互层全局状态 ----
let dc = null;              // 控制 DataChannel（宿主创建，名 ctl）
let inputOn = false;        // 输入回传开关（默认关，避免误操作主机）
let wasControlling = false; // 重连前是否处于控制模式（重连后自动恢复用）
let lastMoveSent = 0;       // 鼠标移动节流时间戳（毫秒）
// ---- 控制通道就绪状态（2026-11-21 实测修复）----
// 症状：连接早期点击主机完全无响应（宿主物理屏也不动），几十秒后才生效。
// 根因：ctlSend 在 dc 未 open 时静默丢消息，而按钮在「开始接收」瞬间就假就绪。
let ctlQueue = [];          // 非输入消息暂存（有界 8 条），onopen 后补发
let ctlWarnAt = 0;          // 「通道未就绪」提示节流
let dcOpenAt = 0;           // dc.onopen 时刻，用于量化握手耗时
let echoSentAt = 0;         // echo 回环自检发出时刻（测 SCTP 双向连通）
// 供质量上报使用的最近一次统计值
let lastFps = 0, lastLossPct = 0, lastRtt = 0, lastJb = 0;
let statsTimer = null;   // getStats 轮询定时器：重连时必须清理，否则会累积多个
let highJbSince = 0;     // 缓冲首次超过看门狗阈值的时刻
let jbRescueCount = 0;   // 本页生命周期内主动重建次数（防无限循环）
// 解码自愈：页面切后台再回来时，内核可能停在「低帧率节能解码」不自行恢复
// （实测：切走前 30fps，切回后恒定 2.0fps 且 document.hidden === false）。
let lowFpsSince = 0;       // 上屏帧率持续过低的起始时刻
let remountCount = 0;      // 重挂视频轨次数（轻量手段，恢复后归零）
let fpsReconnected = false; // 重挂无效后是否已用重建会话兜底（每页一次）
let resetStatsBaseline = false; // 从后台恢复时重置帧率差分基准
let remoteStream = null;   // 远端流引用，供重挂视频轨使用

/// 通过控制通道发一条 JSON。
/// 2026-11-21 实测修复：原来 dc 未 open 时静默丢弃，连接早期所有点击都失踪。
/// 分三类处理：
///   - input（鼠标/键盘）：丢弃并给出可见提示。**绝不排队回放**——几十秒攒下的
///     按下/抬起一次性 flush 会在主机上变成一串乱点，比丢弃更糟；
///   - stat（3 秒周期质量上报）：静默丢弃，下一周期自然补上；
///   - device / hello 等：进有界队列，通道就绪后补发。
function ctlSend(obj) {
  if (!dc || dc.readyState !== 'open') {
    const t = obj && obj.t;
    if (t === 'stat') return false;
    if (t === 'input') {
      const now = performance.now();
      if (now - ctlWarnAt > 3000) {
        ctlWarnAt = now;
        L('⚠ 控制通道未就绪，本次操作未发送（readyState=' + (dc ? dc.readyState : 'null') + '）');
      }
      return false;
    }
    ctlQueue.push(JSON.stringify(obj));
    if (ctlQueue.length > 8) ctlQueue.shift();
    return false;
  }
  try {
    dc.send(JSON.stringify(obj));
    return true;
  } catch (e) {
    L('⚠ 控制消息发送失败：' + (e && e.message ? e.message : e));
    return false;
  }
}

/// 通道就绪后补发暂存的非输入消息。
function flushCtlQueue() {
  if (!ctlQueue.length) return;
  const q = ctlQueue.splice(0, ctlQueue.length);
  for (const s of q) {
    try { dc.send(s); }
    catch (e) { L('⚠ 补发控制消息失败：' + (e && e.message ? e.message : e)); break; }
  }
}

/// 统一复位控制态：新建 PC / 重连 / 通道关闭时都调用。
/// 不清 dc 的话，重连后 dc 仍指向旧通道，输入会继续发进黑洞。
function resetControlUI() {
  // 保存重连前的控制状态：通道恢复后自动接续（页面刷新不保留——安全边界）
  wasControlling = inputOn;
  const d = el('dcstat');
  if (d) d.textContent = '连接中';
  dc = null;
  ctlQueue.length = 0;
  inputOn = false;
  dcOpenAt = 0;
  const b = el('ctlbtn');
  if (b) {
    b.disabled = true;
    b.textContent = '控制通道连接中…';
    b.classList.remove('on');
  }
  video.classList.remove('controlling');
  try { hideCursor(); } catch (_) {}
}

/// 上报本机显示信息（P2.3v2）：宿主据此推荐虚拟屏分辨率。
function sendDeviceInfo() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctlSend({
    t: 'device',
    w: Math.round(w),
    h: Math.round(h),
    dpr: window.devicePixelRatio || 1,
    portrait: h > w,
  });
  L('已上报设备：' + Math.round(w) + 'x' + Math.round(h) +
    ' @' + (window.devicePixelRatio || 1).toFixed(2) + 'x' +
    (h > w ? ' 竖屏' : ' 横屏'));
}

/// 把画面内的指针位置换算成 0~1 归一化坐标（左上原点）。
/// 用 video 元素的渲染矩形，而非窗口，这样缩放/留白都正确。
// 视频内容在页面上的真实显示矩形。
// <video> 元素的比例与视频内容比例不一致时，浏览器会在元素内部加黑边（letterbox），
// 此时 getBoundingClientRect() 返回的是"含黑边"的盒子，直接拿它归一化会让注入坐标偏移。
// 这里按 videoWidth/videoHeight 反算内容实际占据的矩形，黑边区不计入。
function contentRect() {
  const r = video.getBoundingClientRect();
  const vw = video.videoWidth || 0;
  const vh = video.videoHeight || 0;
  if (!r.width || !r.height) return null;
  if (!vw || !vh) return r;            // 元数据还没到，退回元素矩形
  const vidRatio = vw / vh;
  const boxRatio = r.width / r.height;
  let width, height, left, top;
  if (vidRatio > boxRatio) {           // 内容更宽 → 上下黑边
    width = r.width;
    height = width / vidRatio;
    left = r.left;
    top = r.top + (r.height - height) / 2;
  } else {                             // 内容更高 → 左右黑边
    height = r.height;
    width = height * vidRatio;
    left = r.left + (r.width - width) / 2;
    top = r.top;
  }
  return { left, top, width, height };
}

function normCoords(e) {
  const r = contentRect();
  if (!r || !r.width || !r.height) return null;
  return {
    x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
    y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
  };
}
let pc = null, ws = null, started = false;
let tStart = 0, firstFrameLogged = false;
// 宿主只协商一次；重复处理同一份 offer 会让浏览器再发一个 answer，
// 宿主侧从 stable 状态应用第二个 answer 非法，会直接判会话失败。
let lastOfferSdp = '';

// ---- 自动重连（P1.4.3）----
// 断线后重建整条会话：关掉旧 PeerConnection 与 WS，宿主会在 WS 断开时销毁旧会话，
// 然后重新走一遍信令。不做 ICE restart：宿主按 WS 连接 id 建会话，换一条干净连接最可靠。
let reconnTimer = null;
let reconnAttempts = 0;
let reconnInFlight = false;
let closingForReconnect = false;   // 主动关闭 WS 时不要触发"信令断开"重连
let disconnectGrace = null;        // disconnected 的自愈观察窗口

function scheduleReconnect(reason) {
  if (!started || reconnInFlight) return;
  if (reconnAttempts >= 20) {      // 宿主彻底不在了就别无限重试
    renderState('failed');
    L('❌ 重连失败次数过多，请刷新页面重新连接', 'bad');
    return;
  }
  reconnInFlight = true;
  reconnAttempts++;
  const delay = Math.min(500 * Math.pow(2, reconnAttempts - 1), 3000);
  renderState('reconnecting');
  L('⚠️ ' + reason + '，' + delay + 'ms 后重连（第 ' + reconnAttempts + ' 次）');
  clearTimeout(reconnTimer);
  reconnTimer = setTimeout(doReconnect, delay);
}

function doReconnect() {
  reconnTimer = null;
  if (!started) { reconnInFlight = false; return; }
  closingForReconnect = true;
  try { if (pc) { pc.onconnectionstatechange = null; pc.close(); } } catch (_) {}
  pc = null;
  try { if (ws) { ws.onclose = null; ws.close(); } } catch (_) {}
  ws = null;
  closingForReconnect = false;
  lastOfferSdp = '';
  firstFrameLogged = false;        // 重连后重新统计首帧
  lastFps = 0; lastLossPct = 0; lastRtt = 0; lastJb = 0;   // 清掉上一会话的统计残留
  try { video.srcObject = null; } catch (_) {}
  resetControlUI();                // 重连期间立刻禁用控制，避免输入发进旧通道
  reconnInFlight = false;          // 允许这次重连失败后再次调度
  renderState('connecting');
  connectSignaling();
}


function send(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

// ---- P2.7 连接状态 UI：把底层状态翻译成人能看懂的四态 ----
// 必须在 buildPeerConnection 之前可用（脚本内函数声明会提升，但仍放在前面更清晰）
function renderState(state) {
  const box = el('state');
  if (!box) return;
  const map = {
    connecting: ['连接中…', 'warn'],
    connected: ['已连接', 'ok'],
    reconnecting: ['重连中…', 'warn'],
    failed: ['连接失败', 'bad'],
  };
  const [text, cls] = map[state] || ['未连接', ''];
  box.textContent = text;
  box.className = 'pill ' + cls;
}

function buildPeerConnection() {
  // 重连会重新建 PC。若不清掉上一轮的统计定时器：
  // ① 旧 interval 继续跑，用新 PC 的 frames 减旧会话的累计 frames → 算出负 fps；
  // ② 每重连一次就多一个定时器，getStats 调用翻倍。
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
  resetControlUI();          // 清掉上一会话残留的 dc / 输入开关 / 按钮假就绪
  pc = new RTCPeerConnection({ iceServers: [] });   // 与宿主一致：只收 host candidate

  // 宿主在 offer 之前建了 `ctl` 数据通道，这里接收它。
  // 用途：输入回传（P2.5/P2.6）、设备信息上报（P2.3v2）、网络质量上报（P2.1）
  pc.ondatachannel = (e) => {
    if (e.channel.label !== 'ctl') return;
    const ch = e.channel;
    dc = ch;
    L('收到控制通道（readyState=' + ch.readyState + '，开始接收后 '
      + (tStart ? ((performance.now() - tStart) / 1000).toFixed(1) : '?') + 's）');
    el('dcstat').textContent = ch.readyState === 'open' ? 'open' : '握手…';
    const onOpen = () => {
      if (dc !== ch) return;           // 旧通道迟到事件不得覆盖新会话
      if (dcOpenAt) return;            // 幂等：onopen 与 readyState 兜底可能都触发
      dcOpenAt = performance.now();
      const secs = tStart ? ((dcOpenAt - tStart) / 1000).toFixed(1) : '?';
      L('控制通道已就绪（开始接收后 ' + secs + 's）');
      el('dcstat').textContent = 'open';
      const b = el('ctlbtn');
      if (b) { b.disabled = false; b.textContent = '控制本机'; b.classList.remove('on'); }
      // 重连自动恢复控制模式（2026-11-22 修复）：弱网抖动触发重连时
      // resetControlUI 会把 inputOn 安全重置；若重连前用户开着控制，
      // 通道就绪后自动接续。否则每次网络抖动都要手动重开，用户会误判为
      // 「点击大面积失效」（实测踩坑：Clumsy 挂载瞬断 → 重连 → 控制被静默
      // 关闭 → 之后所有点击不发送）。页面刷新不保留该状态，安全边界不变。
      if (wasControlling) {
        wasControlling = false;
        inputOn = true;
        if (b) { b.textContent = '停止控制'; b.classList.add('on'); }
        video.classList.add('controlling');
        L('✓ 已自动恢复控制模式（重连前处于开启状态）');
      }
      flushCtlQueue();
      sendDeviceInfo();
      // 通道回环自检：测 SCTP 双向连通，与 SendInput 是否被拒完全解耦
      echoSentAt = performance.now();
      ctlSend({ t: 'echo' });
      e2eSamples = [];    // 新会话：旧样本作废
      startClockSync();   // 端到端延迟测量：估算两端时钟偏移
    };
    ch.onopen = onOpen;
    // 竞态兜底：若 ondatachannel 事件派发晚于 SCTP 流 open，onopen 事件已错过，
    // 按钮将永远禁用——「点击按钮无响应」的一类直接根因。注册后立刻补查。
    if (ch.readyState === 'open') onOpen();
    ch.onclose = () => {
      L('控制通道已关闭');
      el('dcstat').textContent = 'closed';
      if (dc === ch) resetControlUI();
    };
    ch.onmessage = (ev) => {
      const d = ev.data;
      // echo 回包：通道双向连通的硬证据，同时给出回环延迟
      if (typeof d === 'string' && d.indexOf('echo-ok') >= 0) {
        const ms = echoSentAt ? (performance.now() - echoSentAt).toFixed(0) : '?';
        el('dcstat').textContent = 'open·' + ms + 'ms';
        L('控制通道回环 ' + ms + ' ms：双向连通正常');
        echoSentAt = 0;
        return;
      }
      // 时钟同步回包（端到端延迟）：用最小 RTT 样本估算两端偏移
      if (typeof d === 'string' && d.indexOf('sync-ok') >= 0) {
        try { onSyncOk(JSON.parse(d)); } catch (_) {}
        return;
      }
      // 宿主下发的状态（例如输入是否已启用）
      L('宿主：' + d);
    };
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      send({ t: 'webrtc-cand', candidate: e.candidate.candidate,
             sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex });
    } else {
      L('ICE candidate 收集完成');
    }
  };
  pc.oniceconnectionstatechange = () => { el('ice').textContent = pc.iceConnectionState; };
  pc.onconnectionstatechange = () => {
    el('pc').textContent = pc.connectionState;
    if (pc.connectionState === 'connected') {
      renderState('connected');
      L('✅ WebRTC 已连接', 'ok');
      clearTimeout(disconnectGrace);
      if (reconnAttempts > 0) L('✅ 重连成功（第 ' + reconnAttempts + ' 次）');
      reconnAttempts = 0;
      reconnInFlight = false;
    }
    if (pc.connectionState === 'connecting') renderState('connecting');
    if (pc.connectionState === 'failed') {
      renderState('failed');
      L('❌ 连接失败');
      scheduleReconnect('连接失败');
    }
    if (pc.connectionState === 'disconnected') {
      renderState('reconnecting');
      L('⚠️ 连接断开，2 秒内未恢复将重连');
      // ICE 抖动经常能自愈，先给 2 秒宽限；仍是 disconnected 才真正重建会话
      clearTimeout(disconnectGrace);
      disconnectGrace = setTimeout(() => {
        if (pc && pc.connectionState !== 'connected') scheduleReconnect('连接未恢复');
      }, 2000);
    }
  };
  renderState('connecting');
  pc.ontrack = (e) => {
    L('收到远端视频轨');
    remoteStream = e.streams[0];      // 保存引用：切后台回来后可能需重挂
    video.srcObject = remoteStream;
    video.play().then(() => L('视频开始播放')).catch(err => L('play() 被拒: ' + err.message));

    // 首帧真正上屏的时刻（玻璃侧口径）：含信令 + ICE + SDP + 首个关键帧
    if (!firstFrameLogged && tStart && video.requestVideoFrameCallback) {
      firstFrameLogged = true;
      video.requestVideoFrameCallback(() => {
        L('★ 首帧上屏 +' + (performance.now() - tStart).toFixed(0) + ' ms');
      });
    }

    // 真实上屏帧率：用 requestVideoFrameCallback 统计"真正渲染到屏幕"的帧，
    // 与 getStats 的 framesDecoded/framesDropped 是两套独立口径。
    // 若上屏帧率 ≈ 发送帧率，说明"丢帧"是统计假象；若确实低，才是真丢帧。
    let rvfcCount = 0, rvfcStart = 0;
    const countFrame = (now, meta) => {
      rvfcCount++;
      if (!rvfcStart) rvfcStart = now;
      const sec = (now - rvfcStart) / 1000;
      if (sec >= 1) {
        const realFps = rvfcCount / sec;
        L('【上屏】' + realFps.toFixed(1) + ' fps（' + rvfcCount + ' 帧 / ' + sec.toFixed(1) + 's）');
        rvfcCount = 0; rvfcStart = now;
      }
      video.requestVideoFrameCallback(countFrame);
    };
    if (video.requestVideoFrameCallback) {
      video.requestVideoFrameCallback(countFrame);
    } else {
      L('此内核不支持 requestVideoFrameCallback');
    }
    startE2eProbe();   // 端到端延迟探针读帧循环（宿主未开探针时自动显示「未开启」）
  };

  // ---- 端到端（玻璃到玻璃）延迟探针 ----
  // 宿主 --latency-probe 时在画面左上角叠 16 个黑白方块：
  // bit15 恒 1 = 探针标志；bit0..14 = host_ms mod 32768。
  // 这里用 requestVideoFrameCallback + canvas 读回时间戳，配合 DataChannel
  // 往返（sync / sync-ok，取最小 RTT 样本）估算两端时钟偏移，得到：
  //   玻璃到玻璃延迟 = 上屏时刻 - 宿主发送时刻 - 时钟偏移
  // 未开启探针时读不到标志位，显示「未开启」，不会被画面内容误导。
  const E2E_BLOCK = 32, E2E_GAP = 8, E2E_BITS = 16, E2E_W = 640, E2E_H = 32;
  const E2E_MOD = 32768, E2E_FLAG = 0x8000;
  let e2eCanvas = null, e2eCtx = null;
  let clockOffset = null;        // host_ms - local performance.now 偏移
  let bestSyncRtt = Infinity;    // 最小 RTT 样本（offset 误差 ±rtt/2）
  let e2eSamples = [];           // 最近 240 个延迟样本（ms）
  let e2eUnsupported = false;
  let syncOkAt = 0;              // 最后一次 sync 成功时刻（用于 60 秒刷新）
  let syncNextAt = 0;            // 下次允许发起 sync 的时刻

  function startClockSync() {
    // 5 次往返，取最小 RTT 的那次算偏移（排队抖动最小）。
    // 不清 e2eSamples：60 秒例行刷新时保留已有样本。
    bestSyncRtt = Infinity;
    let n = 0;
    const tick = () => {
      if (!dc || dc.readyState !== 'open' || n >= 5) return;
      n++;
      // c 用字符串发送：宿主 json_str 与 json_num 都能取到（双保险）
      ctlSend({ t: 'sync', c: String(Math.round(performance.now())) });
      setTimeout(tick, 120);
    };
    tick();
  }

  function onSyncOk(msg) {
    const c = Number(msg.c), hs = Number(msg.hs);
    if (!isFinite(c) || !isFinite(hs)) return;
    const rtt = performance.now() - c;
    if (rtt < 0 || rtt > 2000) return;
    if (rtt <= bestSyncRtt) {
      bestSyncRtt = rtt;
      clockOffset = hs - (c + rtt / 2);
      syncOkAt = Date.now();
    }
  }

  function readE2eBits() {
    if (!e2eCtx || !video.videoWidth) return null;
    try {
      e2eCtx.drawImage(video, 0, 0, E2E_W, E2E_H, 0, 0, E2E_W, E2E_H);
    } catch (_) { return null; }
    const img = e2eCtx.getImageData(0, 0, E2E_W, E2E_H).data;
    let v = 0;
    for (let i = 0; i < E2E_BITS; i++) {
      const bx = i * (E2E_BLOCK + E2E_GAP) + E2E_BLOCK / 2;
      const by = E2E_BLOCK / 2;
      let sum = 0;
      // 块中心 8×8 平均亮度：抗 H.264 边缘模糊
      for (let dy = -4; dy < 4; dy++) {
        for (let dx = -4; dx < 4; dx++) {
          const o = ((by + dy) * E2E_W + (bx + dx)) * 4;
          sum += (img[o] + img[o + 1] + img[o + 2]) / 3;
        }
      }
      if (sum / 64 > 128) v |= (1 << i);
    }
    return v;
  }

  function startE2eProbe() {
    // ?noe2e=1 关闭探针采样：A/B 验证 canvas 读帧是否拖累华为平板上屏帧率
    if (location.search.indexOf('noe2e') >= 0) {
      L('e2e 探针已按 ?noe2e 关闭（A/B 对比用）');
      return;
    }
    if (!video.requestVideoFrameCallback) { e2eUnsupported = true; return; }
    if (!e2eCanvas) {
      e2eCanvas = document.createElement('canvas');
      e2eCanvas.width = E2E_W;
      e2eCanvas.height = E2E_H;
      e2eCtx = e2eCanvas.getContext('2d', { willReadFrequently: true });
    }
    let skip = 0;
    let lastDiag = 0;
    const onFrame = (now, meta) => {
      // 每 6 帧读一次（6Hz 足够统计 p50/p95，且 getImageData 不拖累上屏）
      if (skip++ % 6 === 0 && clockOffset !== null) {
        const v = readE2eBits();
        if (v !== null && (v & E2E_FLAG)) {
          const tSend = v & (E2E_MOD - 1);
          // 上屏时刻优先用 expectedDisplayTime（合成器预期显示时刻，比
          // rVFC 回调时刻更接近真实玻璃时刻）
          const showAt = (meta && meta.expectedDisplayTime) || now;
          // clockOffset = 宿主时间 - 本地时间（hs - c - rtt/2），
          // 因此本地时刻换算到宿主时间轴是 showAt + offset（2026-11-22 修正：
          // 原实现写成 showAt - offset，差 2×offset → d 取模后随机落窗口外）。
          let d = (showAt + clockOffset - tSend) % E2E_MOD;
          if (d < 0) d += E2E_MOD;
          // 有效窗口 3~800ms；探针未开/色块被光标遮挡 → 落到窗口外被丢弃
          if (d >= 3 && d <= 800) {
            e2eSamples.push(d);
            if (e2eSamples.length > 240) e2eSamples.shift();
          } else if (now - lastDiag > 2000) {
            lastDiag = now;
            L('[e2e] 时间戳有效但延迟超窗口：d=' + d.toFixed(0)
              + 'ms（offset=' + clockOffset.toFixed(0) + '）', 'warn');
          }
        } else if (now - lastDiag > 2000) {
          // 读不到探针标志位：多半是 canvas 取到黑帧（鸿蒙浏览器 video→canvas 兼容性）
          lastDiag = now;
          L('[e2e] 读不到探针标志：v=0x' + (v === null ? 'null' : v.toString(16))
            + '（v=null 表示 drawImage 失败；v=0 表示取到黑帧）', 'warn');
        }
      }
      if (video.srcObject) video.requestVideoFrameCallback(onFrame);
    };
    video.requestVideoFrameCallback(onFrame);
  }

  function e2ePercentile(p) {
    if (!e2eSamples.length) return null;
    const a = e2eSamples.slice().sort((x, y) => x - y);
    return a[Math.min(a.length - 1, Math.floor(a.length * p))];
  }

  function updateE2eDisplay() {
    const e = el('e2e');
    if (!e) return;
    const p50 = e2ePercentile(0.5), p95 = e2ePercentile(0.95);
    if (p50 !== null) {
      e.textContent = p50.toFixed(0) + ' / ' + p95.toFixed(0) + ' ms';
      e.title = 'p50 / p95（样本 ' + e2eSamples.length + '，时钟偏移误差 ±'
        + (bestSyncRtt === Infinity ? '?' : (bestSyncRtt / 2).toFixed(1)) + 'ms）';
    } else if (e2eUnsupported) {
      e.textContent = '不支持';
    } else if (clockOffset === null) {
      e.textContent = '同步中';
    } else {
      // clockOffset 正常但无样本：区分「色块读不到」与「宿主没开探针」
      e.textContent = '无信号';
    }
  }

  // 每秒采样一次：对外只给瞬时值（差分），累计值对判断卡顿没有意义
  let prev = null;
  let rawLogged = 0;
  statsTimer = setInterval(async () => {
    if (!pc || pc.connectionState !== 'connected') return;
    let st;
    try { st = await pc.getStats(); } catch (e) { return; }

    let frames = 0, bytes = 0, lost = 0, recv = 0, jbDelay = 0, jbCount = 0;
    let framesRecv = 0, framesDrop = 0, nack = 0, retx = 0;
    let jbFlush = 0, jbTarget = 0;
    let rttMs = null, tw = 0, th = 0;
    st.forEach(r => {
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        frames  = r.framesDecoded || 0;
        bytes   = r.bytesReceived || 0;
        lost    = r.packetsLost || 0;
        recv    = r.packetsReceived || 0;
        jbDelay = r.jitterBufferDelay || 0;
        jbCount = r.jitterBufferEmittedCount || 0;
        framesRecv = r.framesReceived || 0;
        framesDrop = r.framesDropped || 0;
        nack = r.nackCount || 0;
        retx = r.retransmittedPacketsReceived || 0;
        jbFlush = r.jitterBufferFlushes || 0;
        jbTarget = r.jitterBufferTargetDelay || 0;
      }
      if (r.type === 'track' && r.kind === 'video') { tw = r.frameWidth || 0; th = r.frameHeight || 0; }
      if (r.type === 'candidate-pair' && r.state === 'succeeded'
          && typeof r.currentRoundTripTime === 'number') {
        rttMs = r.currentRoundTripTime * 1000;
      }
    });

    // 分辨率：video 元素解码后的真实像素最可信（track stats 在部分内核上不填）
    const w = video.videoWidth || tw, h = video.videoHeight || th;
    if (w && h) el('res').textContent = w + 'x' + h;

    // 丢包率：累计占比比 1s 差值稳
    const totalPkts = lost + recv;
    if (totalPkts > 0) {
      const pct = lost * 100 / totalPkts;
      lastLossPct = pct;
      const l = el('loss');
      l.textContent = lost + ' / ' + pct.toFixed(2) + '%';
      l.style.color = pct > 3 ? '#f28b82' : pct > 0.5 ? '#fdd663' : '#81c995';
    }
    if (rttMs !== null) { el('rtt').textContent = rttMs.toFixed(1) + ' ms'; lastRtt = rttMs; }
    // jitterBufferDelay 是解码前缓冲时长，端到端延迟的主要可见组成
    if (jbCount > 0) {
      lastJb = jbDelay * 1000 / jbCount;
      el('jb').textContent = lastJb.toFixed(0) + ' ms';
    }
    // 时钟同步补试/刷新：弱网下首轮 5 次可能全丢；成功后每 60 秒刷新一次
    // （RTT 变化时保持 offset 精度）。
    if (dc && dc.readyState === 'open' && Date.now() >= syncNextAt) {
      if (clockOffset === null) {
        syncNextAt = Date.now() + 5000;   // 未成功：5 秒后重试
        startClockSync();
      } else if (!syncOkAt || Date.now() - syncOkAt > 60000) {
        syncNextAt = Date.now() + 60000;  // 成功：60 秒刷新
        startClockSync();
      }
    }
    // 玻璃到玻璃延迟（需宿主 --latency-probe；未开启显示「未开启」）
    updateE2eDisplay();

    // ---- 高延迟看门狗 ----
    // 弱网雪崩后，浏览器 jitterBuffer 只会渐进收缩：实测从 3.5s 回落到 126ms 要 5 分钟。
    // 与其干等，不如主动重建会话把缓冲清零（黑屏 2~3 秒，但立刻可用）。
    // 阈值 1000ms：正常 20~60ms、1Mbps 峰值 59ms；超过 1 秒操作已明显拖沓。
    if (lastJb > 1000) {
      if (!highJbSince) {
        highJbSince = Date.now();
      } else if (Date.now() - highJbSince >= 10000 && jbRescueCount < 3) {
        highJbSince = 0;
        jbRescueCount++;
        L('⚠️ 缓冲持续 ' + Math.round(lastJb) + 'ms，主动重建会话（第 '
          + jbRescueCount + '/3 次）', 'bad');
        scheduleReconnect('缓冲过高');
      }
    } else {
      highJbSince = 0;
    }
    // 缓冲清空次数：>0 说明浏览器在主动丢缓冲里的帧（累积延迟超限），
    // 这是「丢包 0 但丢帧持续涨」最可能的直接来源
    if (jbFlush > 0) L('⚠ jitterBuffer 已清空 ' + jbFlush + ' 次（目标 ' + jbTarget + 'ms）', 'warn');
    // 解码帧数 / 收到帧数（差值就是被丢的）；重传：收到的重传包 / 发出的 NACK 请求
    if (framesRecv > 0) {
      el('frames').textContent = frames + '/' + framesRecv
        + (framesDrop > 0 ? ' 丢' + framesDrop : '');
    }
    if (nack > 0 || retx > 0) {
      const r = el('retx');
      r.textContent = retx + '/' + nack;
      // NACK 发了却收不到重传 = 宿主没在重传（拦截器未注册时的典型症状）
      r.style.color = (nack > 0 && retx === 0) ? '#f28b82'
                    : (retx < nack ? '#fdd663' : '#81c995');
    }

    // 从后台恢复：后台期间 setInterval 被节流，Δt 会跨很久，先重置差分基准
    if (resetStatsBaseline) { prev = null; resetStatsBaseline = false; }
    const now = performance.now();
    if (prev && now > prev.t) {
      const dt = (now - prev.t) / 1000;
      const fpsNow = (frames - prev.frames) / dt;
      const kbps = (bytes - prev.bytes) * 8 / 1000 / dt;
      // 页面切到后台时浏览器会暂停 video 解码，framesDecoded 不再增长。
      // 这时显示 0 fps 会被误读成链路故障，直接标注出来。
      const bg = document.hidden;
      if (!bg) lastFps = fpsNow;
      // 解码自愈：页面可见、连接正常，但帧率长期 <8 → 内核卡在低帧节能态。
      // 先重挂视频轨（轻量，不黑屏），仍无效才重建会话（每页一次）。
      if (!bg && pc && pc.connectionState === 'connected') {
        // 码率同步塌掉 ⇒ 采集端没有新帧（WGC 静止不出帧），不是解码卡住。
        // 这时重挂视频轨/重建会话都救不了，只会白黑屏，故只标注、不动作。
        const noSource = kbps < 50;
        if (fpsNow < 8 && noSource) {
          lowFpsSince = 0;
        } else if (fpsNow < 8) {
          if (!lowFpsSince) {
            lowFpsSince = Date.now();
          } else if (Date.now() - lowFpsSince >= 5000) {
            lowFpsSince = 0;
            if (remountCount < 2) {
              remountCount++;
              L('⚠ 上屏 ' + fpsNow.toFixed(1) + 'fps 持续 5s，重挂视频轨（第 '
                + remountCount + '/2 次）', 'warn');
              remountVideo();
            } else if (!fpsReconnected) {
              fpsReconnected = true;
              L('⚠ 重挂无效，重建会话以恢复解码', 'bad');
              scheduleReconnect('上屏帧率过低');
            }
          }
        } else {
          lowFpsSince = 0;
          remountCount = 0;   // 恢复后复位，下次再进后台仍可重挂
        }
      }
      el('fps').textContent = bg
        ? '后台挂起'
        : (fpsNow > 0 ? fpsNow.toFixed(1) + ' fps' : '0 fps');
      el('rate').textContent = bg
        ? '后台挂起'
        : (kbps >= 1000
            ? (kbps / 1000).toFixed(2) + ' Mbps'
            : Math.max(0, kbps).toFixed(0) + ' kbps');
      el('bar').style.width = Math.max(0, Math.min(100, kbps / 8)) + '%';   // 800 kbps 满格
    }
    prev = { t: now, frames, bytes };

    // 每 5 秒打印一次 inbound-rtp 的原始诊断，定位「丢包 0 但丢帧涨」的机制
    if (framesRecv > 0 && (!rawLogged || now - rawLogged > 5000)) {
      rawLogged = now;
      L('【raw】framesDecoded=' + frames
        + ' framesReceived=' + framesRecv
        + ' framesDropped=' + framesDrop
        + ' packetsLost=' + lost
        + ' packetsReceived=' + recv
        + ' jitterBufferFlushes=' + jbFlush
        + ' jitterBufferEmitted=' + jbCount
        + ' jitterBufferDelay(s)=' + jbDelay.toFixed(2)
        + ' nackCount=' + nack
        + ' retxPkts=' + retx
        + ' 目标=' + jbTarget);
    }
  }, 1000);
}

function connectSignaling() {
  ws = new WebSocket('ws://' + location.hostname + ':' + WS_PORT + '/');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { el('ws').textContent = '已连接'; L('信令已连接，等待宿主 offer…'); };
  ws.onclose = () => {
    el('ws').textContent = '已断开';
    L('信令断开');
    if (!closingForReconnect) scheduleReconnect('信令断开');
  };
  ws.onerror = () => { el('ws').textContent = '错误'; L('信令错误'); };
  ws.onmessage = async (ev) => {
    let msg;
    try { msg = JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data)); }
    catch (e) { return; }   // 二进制视频数据忽略

    if (msg.t === 'webrtc-offer') {
      // 宿主在 offer 里带了自己的会话号，显示出来以便和宿主日志 `[ctl] #N` 对应
      if (msg.cid) { el('sid').textContent = '#' + msg.cid; L('本会话 = #' + msg.cid); }
      if (msg.sdp === lastOfferSdp) { L('忽略重复 offer（同一份 SDP）'); return; }
      lastOfferSdp = msg.sdp;
      if (!pc) buildPeerConnection();
      L('收到 offer，生成 answer…');
      try {
        await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({ t: 'webrtc-answer', sdp: answer.sdp });
        L('answer 已回传');
      } catch (err) {
        L('❌ SDP 协商失败: ' + err, 'bad');
      }
    } else if (msg.t === 'webrtc-cand') {
      if (!pc) return;
      try {
        await pc.addIceCandidate({ candidate: msg.candidate, sdpMid: msg.sdpMid, sdpMLineIndex: msg.sdpMLineIndex });
      } catch (e) { L('addIceCandidate: ' + e.message); }
    }
  };
}

el('start').addEventListener('click', () => {
  if (started) return;
  started = true;
  tStart = performance.now();
  el('start').style.display = 'none';
  el('native').style.display = 'block';
  el('fs').style.display = 'block';
  // 只显示、不启用：真正的可用性由 dc.onopen 决定（否则是「假就绪」）
  el('ctlbtn').style.display = 'block';
  el('ctlbtn').disabled = true;
  el('ctlbtn').textContent = '控制通道连接中…';
  L('用户已确认开始接收');
  connectSignaling();
  // 必须在用户手势的同一个调用栈里请求全屏，否则会被浏览器拒绝
  enterImmersive();
});

// ---- 全屏 + 屏幕常亮（P2.2）----
// 副屏场景的两条刚需：隐藏浏览器 UI（地址栏占掉一大块）、阻止平板自动息屏。
let wakeLock = null;

async function enterImmersive() {
  const stage = el('stage');
  if (!document.fullscreenElement) {
    try {
      // navigationUI 部分内核不支持，失败时用无参版本再试一次
      await stage.requestFullscreen({ navigationUI: 'hide' });
    } catch (e1) {
      try {
        await stage.requestFullscreen();
      } catch (e2) {
        L('全屏请求被拒: ' + (e2.message || e2));
      }
    }
  }
  await acquireWakeLock();
}

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) {
    L('此内核不支持 Wake Lock（可能仍会自动息屏）');
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    L('屏幕常亮已启用');
    wakeLock.addEventListener('release', () => {
      // 释放通常是页面切后台导致的，切回来会重新申请
      L('屏幕常亮已释放');
    });
  } catch (e) {
    L('屏幕常亮申请失败: ' + (e.message || e));
  }
}

el('fs').addEventListener('click', enterImmersive);
el('exitfs').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
  } catch (e) { /* 忽略 */ }
});

// 重挂视频轨：摘掉 srcObject 再挂回，强制内核重建渲染/解码管线。
// 用于「切后台回来后恒定 2fps」——内核停在低帧节能态且不自行恢复。
function remountVideo() {
  if (!remoteStream) return;
  try { video.pause(); } catch (_) {}
  video.srcObject = null;
  requestAnimationFrame(() => {
    video.srcObject = remoteStream;
    video.play().catch(() => {});
    L('视频轨已重挂');
  });
}

// 页面从后台切回可见时：Wake Lock 会被系统自动释放，需要重新申请；
// 同时重置帧率差分基准（后台期间定时器被节流，Δt 会跨很久导致帧率算出假值）。
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  resetStatsBaseline = true;
  if (video.paused) video.play().catch(() => {});
  if (!wakeLock || wakeLock.released) {
    acquireWakeLock();
  }
});

// 1:1 原始尺寸切换：排除「非整数倍缩放」导致的运动采样抖动。
// width:100% 时 800px 的视频会被拉伸到屏幕宽度（例如 1200px = 1.5 倍），
// 非整数缩放会在运动时产生轻微的位置抖动/边缘呼吸。
el('native').addEventListener('click', () => {
  const on = video.classList.toggle('native');
  L('显示模式：' + (on ? '1:1 原始尺寸（不缩放）' : '自适应宽度（缩放显示）'));
});
// ---- P2.5 / P2.6 输入回传 ----
// 默认关闭：点「控制本机」才开启，避免误触控制到主机。
// 用 Pointer Events 统一处理鼠标与触摸（对两者都适用）。
// ---- 本地光标：宿主以 --no-cursor 启动时画面不含光标，由这里绘制 ----
// 位置直接取触点/鼠标位置，不经过编码与网络，所以零延迟、不会随帧率抖动。
function updateCursor(x, y) {
  const c = el('cursor');
  if (!c) return;
  c.style.transform = 'translate(' + (x - 1) + 'px,' + (y - 1) + 'px)';
  c.style.display = 'block';
}
function hideCursor() {
  const c = el('cursor');
  if (c) c.style.display = 'none';
}

el('ctlbtn').addEventListener('click', () => {
  // 双保险：即使有人手动解除了 disabled，也不允许在通道未就绪时进入控制态
  if (!dc || dc.readyState !== 'open') {
    L('⚠ 控制通道尚未就绪，请等待「控制通道已就绪」后再开启');
    return;
  }
  inputOn = !inputOn;
  wasControlling = inputOn;   // 主动关闭后重连不再自动恢复
  el('ctlbtn').textContent = inputOn ? '停止控制' : '控制本机';
  el('ctlbtn').classList.toggle('on', inputOn);
  // 控制时禁止浏览器手势接管触摸，否则拖动会被 pointercancel 掐断
  video.classList.toggle('controlling', inputOn);
  L(inputOn ? '输入回传已开启（触摸/鼠标将控制主机）' : '输入回传已关闭');
  if (inputOn) {
    sendDeviceInfo();
    ctlSend({ t: 'hello-input' });
  } else {
    hideCursor();
  }
});

let dragging = false;
// ---- 双指滚动 ----
// 移动端浏览器不会为双指滑动产生 wheel 事件（wheel 是桌面滚轮/触控板机制），
// 所以只能自己从多点触控合成：两根手指的纵向平均位移累计到阈值就发一格滚轮。
let twoFinger = false;
let twoFingerLastAvgY = 0;
let twoFingerAccum = 0;
const SCROLL_STEP_PX = 28;              // 折算一格滚轮(120)所需的累计位移
const activePointers = new Map();       // pointerId -> clientY
function twoFingerAvgY() {
  const ys = [...activePointers.values()];
  return ys.length >= 2 ? (ys[0] + ys[1]) / 2 : 0;
}
let longPressTimer = null;
const clearLongPress = () => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
};

video.addEventListener('pointerdown', (e) => {
  if (!inputOn) return;
  activePointers.set(e.pointerId, e.clientY);

  // 第二根手指落下 → 转成双指滚动，并撤销第一根手指已经造成的"按下"
  if (activePointers.size === 2) {
    if (dragging) {
      dragging = false;
      clearLongPress();
      ctlSend({ t: 'input', k: 'b', btn: 'left', d: false });
      try { video.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    twoFinger = true;
    twoFingerAccum = 0;
    twoFingerLastAvgY = twoFingerAvgY();
    L('✋ 双指滚动');
    e.preventDefault();
    return;
  }
  if (twoFinger || activePointers.size > 2) return;   // 三指及以上不处理

  updateCursor(e.clientX, e.clientY);
  const p = normCoords(e);
  if (!p) return;
  e.preventDefault();
  // 按下前先把光标移过去，否则点击会落在旧位置
  ctlSend({ t: 'input', k: 'm', x: p.x, y: p.y });
  ctlSend({ t: 'input', k: 'b', btn: 'left', d: true });
  dragging = true;
  L('↓ 按下（左键）');
  try { video.setPointerCapture(e.pointerId); } catch (_) {}
  // 长按 500ms 视为右键（移动端没有右键）
  clearLongPress();
  longPressTimer = setTimeout(() => {
    longPressTimer = null;
    if (!dragging) return;
    dragging = false;
    ctlSend({ t: 'input', k: 'b', btn: 'left', d: false });
    ctlSend({ t: 'input', k: 'b', btn: 'right', d: true });
    ctlSend({ t: 'input', k: 'b', btn: 'right', d: false });
    L('已发送右键');
  }, 500);
});

video.addEventListener('pointermove', (e) => {
  if (!inputOn) return;
  if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, e.clientY);

  // 双指滚动：按两指平均纵向位移累计发滚轮
  if (twoFinger) {
    if (activePointers.size >= 2) {
      const avg = twoFingerAvgY();
      twoFingerAccum += avg - twoFingerLastAvgY;
      twoFingerLastAvgY = avg;
      // 手指上滑(avg 变小) → 想看下面的内容 → 滚轮向下(-120)；反之 +120
      while (Math.abs(twoFingerAccum) >= SCROLL_STEP_PX) {
        const dir = twoFingerAccum > 0 ? 120 : -120;
        ctlSend({ t: 'input', k: 'w', d: dir });
        twoFingerAccum -= (twoFingerAccum > 0 ? SCROLL_STEP_PX : -SCROLL_STEP_PX);
      }
    }
    e.preventDefault();
    return;
  }

  updateCursor(e.clientX, e.clientY);   // 本地光标立即跟手，不等编码/网络
  if (dragging) clearLongPress();       // 一旦开始移动就不再算长按
  // 节流到 ~60Hz：DataChannel 再多发也没意义，反而占带宽
  const now = performance.now();
  if (now - lastMoveSent < 16) return;
  lastMoveSent = now;
  const p = normCoords(e);
  if (!p) return;
  // 鼠标：悬停也移动主机光标；触摸屏没有 hover，只有按住拖动时才发
  if (e.pointerType === 'mouse' || dragging) {
    ctlSend({ t: 'input', k: 'm', x: p.x, y: p.y });
  }
});

function endDrag(e) {
  clearLongPress();
  if (!inputOn || !dragging) return;
  dragging = false;
  ctlSend({ t: 'input', k: 'b', btn: 'left', d: false });
  try { video.releasePointerCapture(e.pointerId); } catch (_) {}
}
video.addEventListener('pointerup', (e) => {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) twoFinger = false;
  L('↑ 抬起');
  endDrag(e);
});
// pointercancel = 浏览器把手势"抢走"了（当滚动/缩放处理）。出现它说明触摸没被
// 当成原生拖拽，是我们的 bug；不出现却拖不动，则要怀疑 Windows 的焦点激活行为。
video.addEventListener('pointercancel', (e) => {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) twoFinger = false;
  L('⚠️ 手势被浏览器取消(pointercancel)');
  endDrag(e);
});

// 滚轮：一格 = 120
video.addEventListener('wheel', (e) => {
  if (!inputOn) return;
  e.preventDefault();
  ctlSend({ t: 'input', k: 'w', d: e.deltaY > 0 ? -120 : 120 });
}, { passive: false });

// 键盘：仅在输入回传开启时捕获，避免影响页面本身操作
const KEYMAP = {
  Enter: 13, Escape: 27, Backspace: 8, Tab: 9, Space: 32,
  ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40,
  Delete: 46, Home: 36, End: 35, PageUp: 33, PageDown: 34,
  Shift: 16, Control: 17, Alt: 18, Meta: 91,
  F1: 112, F2: 113, F3: 114, F4: 115, F5: 116, F6: 117,
  F7: 118, F8: 119, F9: 120, F10: 121, F11: 122, F12: 123,
};
function vkOf(e) {
  if (KEYMAP[e.key]) return KEYMAP[e.key];
  if (e.key.length === 1) return e.key.toUpperCase().charCodeAt(0);
  return 0;
}
window.addEventListener('keydown', (e) => {
  if (!inputOn) return;
  const vk = vkOf(e);
  if (!vk) return;
  e.preventDefault();
  ctlSend({ t: 'input', k: 'key', vk: vk, d: true });
});
window.addEventListener('keyup', (e) => {
  if (!inputOn) return;
  const vk = vkOf(e);
  if (!vk) return;
  e.preventDefault();
  ctlSend({ t: 'input', k: 'key', vk: vk, d: false });
});

// ---- P2.1 质量上报：每 3 秒把上屏帧率/丢包/RTT/缓冲发给宿主，由其给出码率建议 ----
setInterval(() => {
  if (!dc || dc.readyState !== 'open') return;
  if (!pc || pc.connectionState !== 'connected') return;
  ctlSend({
    t: 'stat',
    fps: Math.round(lastFps * 10) / 10,
    loss: Math.round(lastLossPct * 100) / 100,
    rtt: Math.round(lastRtt),
    jb: Math.round(lastJb),
    // 页面是否在后台：后台时浏览器暂停解码，lastFps 会冻结在旧值，
    // 宿主看到固定不变的整数帧率会误判成"链路掉到 2fps"。
    bg: document.hidden ? 1 : 0,
  });
}, 3000);
</script>
</body>
</html>
