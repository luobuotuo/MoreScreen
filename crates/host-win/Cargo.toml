[package]
name = "remote-screen-host-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows 宿主端：显示枚举 / WGC 采集 / Media Foundation H.264 编码 / 局域网传输"

[dependencies]
remote-screen-core = { path = "../core" }
windows = { version = "0.61", default-features = false, features = [
    "Foundation",
    "Graphics_Capture",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_DxMediaObjects",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }

[[bin]]
name = "rs-host"
path = "src/main.rs"
