[package]
name = "remote-screen-host-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows 宿主端：显示枚举 / WGC 采集 / Media Foundation H.264 编码 / 局域网传输"

[dependencies]
remote-screen-core = { path = "../core" }
tungstenite = "0.21"
# ---- P1.1 WebRTC 传输层（路线 A）----
webrtc = "0.12"          # WebRTC 栈（pion 移植）：ICE/DTLS/SRTP/TURN/DataChannel
env_logger = "0.11"      # webrtc-rs / DTLS 层日志（RUST_LOG 控制，默认 warn 静默）
rtp = "0.12"             # RTP 层：H264Payloader 自动做 STAP-A + FU-A
bytes = "1"              # webrtc/rtp 的 Bytes 类型
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
windows = { version = "0.61", default-features = false, features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Gdi",
    "Win32_Media_DxMediaObjects",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "rs-host"
path = "src/main.rs"
